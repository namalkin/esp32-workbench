; Только для `docker build`: заранее качает платформу и тулчейны, чтобы потом собирать офлайн.
; Новая плата — добавь env сюда и пересобери образ.

[platformio]
src_dir = .

[env]
platform = espressif32@6.9.0
framework = arduino

[env:esp32dev]
board = esp32dev

[env:esp32-c3]
board = esp32-c3-devkitm-1
