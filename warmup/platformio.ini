; Только для `docker build`: заранее качает платформу и тулчейны, чтобы потом собирать офлайн.
; Плата с другим чипом — добавь env сюда и пересобери образ. Платы на уже прогретом чипе
; (любая ESP32, S2, S3, C3) собираются офлайн и без этого.

[platformio]
src_dir = .

[env]
platform = espressif32@6.9.0
framework = arduino

; xtensa-esp32: DevKit v1, ESP32-CAM, WROVER...
[env:esp32]
board = esp32dev

[env:esp32-s2]
board = lolin_s2_mini

[env:esp32-s3]
board = esp32-s3-devkitc-1

; riscv32-esp: C3
[env:esp32-c3]
board = esp32-c3-devkitm-1
